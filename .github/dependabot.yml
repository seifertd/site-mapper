version: 2
updates:
# Dependencies are updated by hand: one `npm update` on a monthly schedule (the
# dependency-update skill), reviewed for major bumps, then tested before shipping.
# One-package-per-PR version updates went stale and conflicted with each other,
# and closing one tells Dependabot to ignore that release.
#
# A limit of 0 stops version-update PRs only. Security alerts still arrive, and
# security-update PRs still open if they are enabled in the repo settings.
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 0
# Package updates never touch workflow files, so Actions stay with Dependabot.
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
